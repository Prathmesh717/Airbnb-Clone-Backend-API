services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: airbnb-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: airbnb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb -d airbnb"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: airbnb-clone-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
